name: Windows browser capture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL: skip
      USOVIA_BROWSER_FIXTURE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile Windows current-user routing helper
        shell: pwsh
        run: ./scripts/build-windows-browser-helper.ps1
      - name: Strict TLS, system PAC, conversations and restoration in real browsers
        run: node scripts/test-windows-browsers.mjs
      - name: Preserve controlled browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-browser-evidence
          path: |
            ${{ runner.temp }}/Usovia-browser-fixture/windows-browser-verification.json
            ${{ runner.temp }}/Usovia-browser-fixture/*.png
          if-no-files-found: warn
